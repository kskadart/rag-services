[project]
name = "embedding-service"
version = "0.1.0"
description = "gRPC-based embedding service for RAG applications"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "grpcio==1.75.1",
    "grpcio-tools==1.75.1",
    "grpcio-health-checking==1.75.1",
    "grpcio-reflection==1.75.1",
    "transformers==4.45.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.11.0",
]

[project.optional-dependencies]
cpu = [
  "torch==2.9.0",
]
cu128 = [
  "torch==2.9.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "black==25.9.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.0",
]

[tool.black]
line-length = 120
target-version = ['py313']

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
